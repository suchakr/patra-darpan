name: iscls-bakeoff

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
    restart: "no"
    # Local-only by design. The later MCP service talks to Qdrant on the
    # workstation; this profile is not a production exposure configuration.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - iscls-bakeoff-qdrant:/qdrant/storage

volumes:
  iscls-bakeoff-qdrant:
