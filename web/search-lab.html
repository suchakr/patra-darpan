<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patra Darpan Search Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/search-lab.css?v=foldgroup-20260422">
</head>

<body>
  <main class="search-shell">
    <header class="search-header">
      <div>
        <a class="back-link" href="index.html">Patra Darpan</a>
        <h1>Search Lab</h1>
      </div>
      <div class="status-group">
        <span class="pilot-badge">Decoded pilot</span>
        <span id="corpus-stats" class="corpus-stats">Loading corpus...</span>
      </div>
    </header>

    <section class="search-panel" aria-label="Decoded corpus search">
      <form id="search-form" class="search-form">
        <label for="search-query">Search decoded chunks</label>
        <div class="query-row">
          <input id="search-query" name="q" type="search" autocomplete="off"
            placeholder="Try Yājñavalkya cycle, Saptarṣi era, pandiagonal magic square">
          <button type="submit">Search</button>
        </div>
      </form>
      <p class="scope-note">
        Lexical retrieval over semantic-ready decoded chunks. Results cite document, heading, neighboring context, and
        source provenance.
      </p>
      <div id="query-suggestions" class="query-suggestions" aria-label="Suggested and recent searches"></div>
    </section>

    <section class="results-summary" aria-live="polite">
      <div id="result-count">Enter a query to search the decoded pilot.</div>
    </section>

    <section id="results" class="results-list" aria-label="Search results"></section>
  </main>

  <template id="result-template">
    <article class="result-item">
      <div class="result-main">
        <div class="result-rank"></div>
        <div class="result-body">
          <div class="result-meta"></div>
          <h2></h2>
          <div class="heading-path"></div>
          <p class="snippet"></p>
          <div class="context-row"></div>
          <div class="result-actions"></div>
        </div>
      </div>
    </article>
  </template>

  <script src="assets/js/search-core.js?v=foldgroup-20260422"></script>
  <script src="assets/js/search-lab.js?v=foldgroup-20260422"></script>
</body>

</html>
